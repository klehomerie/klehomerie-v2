name: Weekly Netlify Rebuild

on:
  schedule:
    # Runs every other day at 8:00 AM UTC
    - cron: '0 8 */2 * *' 
  
  # This is now correctly aligned with "schedule"
  workflow_dispatch: 

jobs:
  rebuild:
    name: Trigger Netlify Build Hook
    runs-on: ubuntu-latest
    steps:
      - name: Ping Netlify
        # Added double quotes around the secret for safety
        run: curl -X POST -d {} "${{ secrets.NETLIFY_BUILD_HOOK }}"