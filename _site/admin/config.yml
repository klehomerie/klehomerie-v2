backend:
  name: git-gateway
  branch: main

# 1. THIS FIXES THE LOGIN ERROR ON LOCALHOST
local_backend: true

media_folder: "src/assets/images/uploads"
public_folder: "/assets/images/uploads"

preview_styles:
  - /assets/css/style.css

collections:
  - name: "posts"
    label: "Lab Articles"
    folder: "src/klab/posts"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
     
      
      # A. METADATA
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Summary", name: "summary", widget: "text", hint: "Short teaser (max 160 chars)."}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Updated on", name: "updated_date", widget: "datetime"}
      - {label: "Category", name: "category", widget: "select", options: ["Technical Insight", "Red Flag Scans", "Golden Visa Strategy", "French Standards", "Regulatory Vigie"]}
      - {label: "Language", name: "language", widget: "select", options: ["en", "fr"], default: "en"}

      # B. SPECIFICS
      - {label: "Property Type", name: "property_type", widget: "string", default: "Residential"}
      - {label: "Location", name: "location", widget: "string", default: "Athens, Greece"}

      # C. HERO IMAGE
      - {label: "Featured Image", name: "image", widget: "image"}

      # D. BODY (Rich Text)
      - label: "Body"
        name: "body"
        widget: "markdown"
        buttons: ["bold", "italic", "strikethrough", "code", "link", "heading-one", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]
        editor_components: ["image"]
  - name: "testimonials_data"
    label: "Testimonials"
    files:
      - label: "Client & Partner Quotes"
        name: "testimonials"
        file: "src/_data/testimonials.json"
        fields:
          - label: "Testimonials List"
            name: "items"
            widget: "list"
            summary: '{{fields.name}} - {{fields.type}}'
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Role", name: "role", widget: "string"}
              - {label: "Location", name: "location", widget: "string", required: false}
              - {label: "Website URL", name: "website", widget: "string", required: false}
              - {label: "Type", name: "type", widget: "select", options: ["client", "contractor"]}
              - {label: "Featured (Show on Homepage slider)", name: "featured", widget: "boolean", default: true}
              - {label: "Image / Avatar", name: "image", widget: "image", required: false}
              - {label: "Original Language", name: "originalLanguage", widget: "select", options: ["en", "fr", "el"]}
              - {label: "Short Quote (English)", name: "shortQuote_en", widget: "text"}
              - {label: "Short Quote (French)", name: "shortQuote_fr", widget: "text", required: false}
              - {label: "Short Quote (Greek)", name: "shortQuote_el", widget: "text", required: false}
              - {label: "Full Original Quote", name: "fullQuoteOriginal", widget: "text"}
              - {label: "Full English Quote", name: "fullQuote_en", widget: "text"}    
              - {label: "Full French Quote", name: "fullQuote_fr", widget: "text"}
              - {label: "Full Greek Quote", name: "fullQuote_el", widget: "text"}  
  - name: "media"
    label: "Press & Media"
    folder: "src/media" # Make sure this matches your actual folder path
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publisher Name", name: "publisher", widget: "string"}
      - {label: "Publication Date", name: "date", widget: "date"}
      - {label: "Publisher Logo", name: "logoUrl", widget: "image", required: true}
      - {label: "Article Thumbnail", name: "thumbnailUrl", widget: "image", required: false}
      - {label: "Short Excerpt", name: "excerpt", widget: "text"}
      - {label: "External Link", name: "link", widget: "string"}
      - {label: "Article Language", name: "articleLanguage", widget: "select", options: ["English", "French", "Greek"]}      