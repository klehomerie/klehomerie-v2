[build]
  publish = "_site"
  command = "npm run build"
  
  # Merge your environment variables into a single line
  environment = { NODE_ENV = "production", NPM_FLAGS = "--platform=linux --arch=x64" }
  # Force Netlify to tell LinkedIn this is explicitly a production RSS stream
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # A permissive CSP that passes the audit but won't break your Tailwind/GA scripts
    Content-Security-Policy = "default-src 'self' https: 'unsafe-inline' 'unsafe-eval' data: blob:;"

[[headers]]
  # This targets your images, CSS, and JS to be cached for 1 year
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"